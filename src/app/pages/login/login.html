<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<div class="fondo d-flex justify-content-center align-items-center vh-100">
    <img src="imagenes/colaDinosario.png" alt="cola dino" class="dino-cola">
    <div class="card-login p-5 text-center">
        <img src="imagenes/Dinofosil.png" alt="dino" class="dino-fosil">
        
        <h1 class="titulo mb-0">Quesaurillas</h1>
        <p class="subtitulo mb-4">Grrr...</p>
        <div *ngIf="error" class="alert-error mb-3">{{error}}</div>

        <!-- Campo Usuario-->

        <div class="input-dino d-flex align-items-center gap-3 mb-3">
            <span class="icono">🦕</span>
            <input type="text" class="campo" [(ngModel)]="username" placeholder="Usuario"/>

        </div>

        <!-- Campo Contraseña-->

        <div class="input-dino d-flex align-items-center gap-3 mb-3">
            <span class="icono">🥚</span>
            <input type="text" class="campo" [(ngModel)]="password" placeholder="Contraseña"/>

        </div>

        <button class="btn-ingresar w-100 mt-2" (click)="onLogin()">Ingresar</button>
    </div>
</div>
